[project]
name = "private-doc-rag"
version = "0.1.0"
description = "Private document RAG assistant with PDF citations and streaming answers"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0.0,<2",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic-settings>=2.5.0,<3",
  "pymupdf>=1.24.0,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "reportlab>=4.2.0,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
